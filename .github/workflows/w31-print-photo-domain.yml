name: W31 true print sign versus original papyrus source-domain OOD learning
on:
  push:
    branches: ['overseer/w31-public-met-print-domain-discriminator']
    paths: ['tools/w31_original_print_domain.py','tests/research/test_w31_original_print_domain.py','.github/workflows/w31-print-photo-domain.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-publisher-and-original-met-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 Pillow==11.3.0
      - run: |
          test -s docs/waves/W31_PRINT_PHOTO_OOD_PREREG.md
          python -m unittest tests.research.test_w31_original_print_domain -v
      - name: Fit actual source-domain model on licensed printed originals and Met photographs
        run: |
          python -m tools.w31_original_print_domain --output "$RUNNER_TEMP/w31-source-domain.json"
          python - <<'PY'
          import os,json
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'w31-source-domain.json').read_text())
          assert r['trained_on_real_source_images']
          assert r['new_met_original_photo']['object_id']==555779
          assert r['heldout']['new_original_photo_tiles']==32
          assert r['true_manuscript_sign_accuracy'] is None
          print('PASS W31 actual new original photo cross-physical-source domain detector')
          PY
      - if: success()
        uses: actions/upload-artifact@v4
        with:
          name: w31-original-photo-print-domain-actual-metrics
          path: ${{ runner.temp }}/w31-source-domain.json
          retention-days: 14
