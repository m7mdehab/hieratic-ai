project:
  name: "Hieratic AI"
  repository: "m7mdehab/hieratic-ai"
  visibility: "public"
  ultimate_goal: >-
    Build and publicly demonstrate a reproducible multimodal AI system that can
    take genuinely unseen Hieratic handwriting, recognize what is written,
    produce a defensible transliteration and normalization, and derive
    meaning/translation with calibrated uncertainty while generalizing beyond
    memorized documents or scribes and improving over untuned frontier VLMs
    and appropriate specialist baselines.

