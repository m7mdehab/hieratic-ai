name: Untuned Frontier Baseline Preflight

on:
  pull_request:
    branches: [main]
    paths:
      - "eval/baselines/**"
      - "tests/evaluation/test_frontier_baselines.py"
      - "docs/evaluation/FRONTIER_BASELINES.md"
      - ".github/workflows/frontier-baselines.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-preflight:
    name: Verify no baseline inference without approval
    runs-on: ubuntu-latest
    steps:
      - name: Check out project code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install existing validation dependencies
        run: python -m pip install -r requirements-projectctl.txt

      - name: Confirm canonical project state
        run: python -m tools.projectctl validate

      - name: Validate baseline suite structure
        run: python -m eval.baselines.baselinectl validate-suite

      - name: Assert unapproved paid inference remains blocked
        run: |
          if python -m eval.baselines.baselinectl preflight; then
            echo "FAIL: planning-only suite must not pass execution preflight"
            exit 1
          fi
          echo "PASS: planning suite fails closed before model API calls"

      - name: Validate explicitly non-executable synthetic per-model run draft
        run: python -m eval.baselines.run_freeze validate-draft

      - name: Reject synthetic draft as an inference authorization
        run: |
          if python -m eval.baselines.run_freeze verify-locked \
            --record eval/baselines/examples/run-freeze.draft.synthetic.json \
            --suite eval/baselines/suite.yaml \
            --items eval/baselines/examples/run-freeze.draft.synthetic.json \
            --attempts eval/baselines/examples/run-freeze.draft.synthetic.json \
            --vault eval/baselines --upstream-checkout eval/benchmarks; then
            echo "FAIL: synthetic draft must not permit inference"
            exit 1
          fi
          echo "PASS: run-level authorization remains blocked"

      - name: Run entire evaluation test suite
        run: python -m unittest discover -s tests/evaluation -v

      - name: Checkout pinned external benchmark metadata and prompt source
        uses: actions/checkout@v7
        with:
          repository: alymoursy/hieraticbench
          ref: d587dc990013f18007f1e7a8f56f96ff2f7127e2
          path: _external/hieraticbench
          sparse-checkout: |
            data/items
            bench/src/prompts.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Freeze then reverify public-only item and prompt-source hashes
        env:
          BENCH_CHECKOUT: _external/hieraticbench
          FREEZE_DIR: ${{ runner.temp }}/hieratic-public-freeze
        run: |
          mkdir -p "$FREEZE_DIR"
          python -m eval.baselines.public_freeze freeze --checkout "$BENCH_CHECKOUT" --output-dir "$FREEZE_DIR"
          python -m eval.baselines.public_freeze verify --checkout "$BENCH_CHECKOUT" --output-dir "$FREEZE_DIR"
          # No public benchmark items, gold or prompt source uploaded as artifacts.
