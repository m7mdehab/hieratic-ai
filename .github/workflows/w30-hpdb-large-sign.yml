name: W30 B publisher original Tokyo IIIF larger real-pixel sign model
on:
  push:
    branches: ['overseer/w30-hpdb-large-sign-learning']
    paths: ['tools/w30_hpdb_large_sign.py','tests/research/test_w30_hpdb_large_sign.py','.github/workflows/w30-hpdb-large-sign.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-publisher-pixel-training:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 Pillow==11.3.0
      - run: |
          test -s docs/waves/W30_B_PREREG_LARGE_PRINTED_SIGNS.md
          python -m unittest tests.research.test_w30_hpdb_large_sign -v
      - run: |
          python -m tools.w30_hpdb_large_sign --output "$RUNNER_TEMP/w30-signs.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ['RUNNER_TEMP'])/'w30-signs.json').read_text())
          assert x['original_iiif_jpeg_pixels_actually_read']
          assert x['train_items']>=16 and x['test_items']>=8
          assert x['original_papyrus_photographs_included'] is False
          print('PASS authentic printed-source CPU learning',x['train_items'],x['test_items'])
          PY
      - if: success()
        uses: actions/upload-artifact@v4
        with:
          name: w30-hpdb-expanded-classifier-metrics
          path: ${{ runner.temp }}/w30-signs.json
          retention-days: 14
