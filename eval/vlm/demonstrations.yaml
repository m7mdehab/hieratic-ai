doc_type: "vlm_demonstration_bank"
schema_version: "1.0.0"
bank_id: "vlm-demos-quarantine-v1"
description: "Quarantined reference demonstrations for few-shot evaluation across script identification, sign recognition, transliteration, and translation."

rights_review:
  license: "CC0-1.0 / Public Domain"
  rights_class: "OPEN-PD"
  rights_review_status: "approved_with_evidence"
  quarantine_verified: true
  notes: "Curated from public domain palaeographical facsimiles (Möller Hieratische Paläographie 1909-1912 and open-access PD collections). Zero overlap with HieraticBench benchmark items or sealed holdouts."

items:
  - demo_id: "DEMO-IDENT-001"
    rung: "identify"
    source_provenance: "Möller Hieratische Paläographie Vol. 1, Plate I, No. 1 (1909; Public Domain)"
    image_ref: "facsimile://moeller-vol1-pl01-item01"
    image_sha256: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
    prompt_instruction: "Identify the script used in this text. Select exactly one of: Hieratic, Hieroglyphic, Demotic, Coptic."
    exemplar_output: "Hieratic"
    commentary: "Characteristic cursive ligatures and ink flow of early Middle Kingdom literary Hieratic."

  - demo_id: "DEMO-IDENT-002"
    rung: "identify"
    source_provenance: "Lepsius Denkmäler Abth. II, Bl. 123 (1849; Public Domain)"
    image_ref: "facsimile://lepsius-abth2-bl123"
    image_sha256: "d41d8cd98f00b204e9800998ecf8427e00000000000000000000000000000001"
    prompt_instruction: "Identify the script used in this text. Select exactly one of: Hieratic, Hieroglyphic, Demotic, Coptic."
    exemplar_output: "Hieroglyphic"
    commentary: "Monumental carved pictorial characters on limestone relief."

  - demo_id: "DEMO-IDENT-003"
    rung: "identify"
    source_provenance: "Spiegelberg Demotische Grammatik Tafel I (1925; Public Domain)"
    image_ref: "facsimile://spiegelberg-demot-taf01"
    image_sha256: "d41d8cd98f00b204e9800998ecf8427e00000000000000000000000000000002"
    prompt_instruction: "Identify the script used in this text. Select exactly one of: Hieratic, Hieroglyphic, Demotic, Coptic."
    exemplar_output: "Demotic"
    commentary: "Late period cursive document hand with highly abridged sign groups."

  - demo_id: "DEMO-SIGN-001"
    rung: "signs"
    source_provenance: "Möller Hieratische Paläographie Vol. 2, No. 1 (Man seated) (1909; Public Domain)"
    image_ref: "facsimile://moeller-vol2-sign-a01"
    image_sha256: "a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1"
    prompt_instruction: "Identify the corresponding Gardiner sign code (e.g., A1, G43, M17, O34)."
    exemplar_output: "A1"
    commentary: "Hieratic cursive form of the seated man determinative A1."

  - demo_id: "DEMO-SIGN-002"
    rung: "signs"
    source_provenance: "Möller Hieratische Paläographie Vol. 2, No. 202 (Quail chick) (1909; Public Domain)"
    image_ref: "facsimile://moeller-vol2-sign-g43"
    image_sha256: "b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2"
    prompt_instruction: "Identify the corresponding Gardiner sign code (e.g., A1, G43, M17, O34)."
    exemplar_output: "G43"
    commentary: "Hieratic stroke ligature for the quail chick sign G43 (uniliteral w)."

  - demo_id: "DEMO-SIGN-003"
    rung: "signs"
    source_provenance: "Möller Hieratische Paläographie Vol. 2, No. 268 (Flowering reed) (1909; Public Domain)"
    image_ref: "facsimile://moeller-vol2-sign-m17"
    image_sha256: "c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3"
    prompt_instruction: "Identify the corresponding Gardiner sign code (e.g., A1, G43, M17, O34)."
    exemplar_output: "M17"
    commentary: "Hieratic vertical stroke with hook for the flowering reed M17 (uniliteral j)."

  - demo_id: "DEMO-XLIT-001"
    rung: "transliterate"
    source_provenance: "Ebers Papyrus Facsimile Wreszinski Tafel 1 (1912; Public Domain)"
    image_ref: "facsimile://ebers-facs-tafel01-phrase01"
    image_sha256: "d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4"
    prompt_instruction: "Transliterate the hieratic text into standard Egyptological transliteration."
    exemplar_output: "ḥꜣ.t-ꜥ m sšr"
    commentary: "Standard heading formula in New Kingdom medical hieratic."

  - demo_id: "DEMO-TRANS-001"
    rung: "translate"
    source_provenance: "Rhind Mathematical Papyrus Peet Plate A (1923; Public Domain)"
    image_ref: "facsimile://rhind-peet-plate-a"
    image_sha256: "e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5"
    prompt_instruction: "Translate the ancient Egyptian inscription into clear, accurate English."
    exemplar_output: "Beginning of the calculation of the reckoning of things."
    commentary: "Introductory phrase of the Rhind Papyrus."
