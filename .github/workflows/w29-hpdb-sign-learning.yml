name: W29 B — actual Tokyo historical sign CPU classifier training
on:
  push:
    branches:
      - 'overseer/w29-hpdb-sign-learning'
    paths:
      - 'tools/w29_hpdb_sign_learning.py'
      - 'tests/research/test_w29_hpdb_sign_learning.py'
      - '.github/workflows/w29-hpdb-sign-learning.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  licensed-publisher-original-signs:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact CPU original pixel feature dependencies
        run: python -m pip install numpy==2.2.6 Pillow==11.3.0
      - name: Freeze licensed catalogue, run classifier adversarial tests
        run: |
          test -s docs/waves/W29_HPDB_SIGN_PRECOMMIT_PROTOCOL.md
          python -m unittest tests.research.test_w29_hpdb_sign_learning -v
      - name: Train actual IIIF original pixel classifiers on printed volumes I-II and evaluate III
        run: |
          set -euo pipefail
          python -m tools.w29_hpdb_sign_learning --output "$RUNNER_TEMP/w29_signs.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ['RUNNER_TEMP'])/'w29_signs.json').read_text())
          assert x['original_iiif_jpeg_pixels_actually_read']
          assert x['train_items']>=16 and x['test_items']>=8
          assert x['original_papyrus_photographs_included'] is False
          assert x['official_benchmark_or_capability_points']==0
          print('PASS: authentic source sign classification, train/test separated by historical printed volume')
          PY
      - name: Archive aggregate published-source hashes and metrics only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: w29-hpdb-real-iiif-cpu-sign-classifier
          path: ${{ runner.temp }}/w29_signs.json
          retention-days: 14
