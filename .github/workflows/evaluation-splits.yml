name: Evaluation split policy tests

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/evaluation-splits.yml"
      - "data/sources/registry.yaml"
      - "eval/splits/**"
      - "schemas/split_manifest.schema.json"
      - "tools/split_system.py"
      - "tests/evaluation/test_split_system.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/evaluation-splits.yml"
      - "data/sources/registry.yaml"
      - "eval/splits/**"
      - "schemas/split_manifest.schema.json"
      - "tools/split_system.py"
      - "tests/evaluation/test_split_system.py"

permissions:
  contents: read

jobs:
  splits:
    name: Validate leakage-resistant split policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install project control dependencies
        run: python -m pip install -r requirements-projectctl.txt

      - name: Run split policy tests
        run: python -m unittest discover -s tests/evaluation -p "test_split_system.py" -v
