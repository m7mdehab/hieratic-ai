name: VLM Baselines Evaluation Preflight

on:
  pull_request:
    branches: [main]
    paths:
      - "tasks/VLM-001.md"
      - "eval/vlm/**"
      - "schemas/vlm_baselines.schema.json"
      - "tools/vlm_baselines.py"
      - "tests/evaluation/test_vlm_baselines.py"
      - "docs/evaluation/VLM_BASELINES.md"
      - ".github/workflows/vlm-baselines.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vlm-baselines-preflight:
    name: Verify zero/few-shot VLM evaluation harness
    runs-on: ubuntu-latest
    steps:
      - name: Check out project code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-projectctl.txt

      - name: Confirm canonical project state
        run: python -m tools.projectctl validate

      - name: Validate baseline suite configuration
        run: python -m tools.vlm_baselines validate-suite

      - name: Validate quarantined few-shot demonstration bank
        run: python -m tools.vlm_baselines validate-demonstrations

      - name: Run synthetic evaluation and generate immutable manifest
        env:
          MANIFEST_PATH: ${{ runner.temp }}/vlm_ci_manifest.json
          REPORT_PATH: ${{ runner.temp }}/vlm_ci_report.json
        run: |
          python -m tools.vlm_baselines run \
            --model mock-vision-v1 \
            --shot-mode both \
            --output "$MANIFEST_PATH"
          python -m tools.vlm_baselines audit-manifest \
            --manifest "$MANIFEST_PATH" \
            --universe eval/vlm/universe.yaml
          python -m tools.vlm_baselines score \
            --manifest "$MANIFEST_PATH" \
            --output "$REPORT_PATH"

      - name: Verify promotion prevention on synthetic fixtures
        env:
          MANIFEST_PATH: ${{ runner.temp }}/vlm_ci_manifest.json
        run: |
          if python -m tools.vlm_baselines audit-manifest --manifest "$MANIFEST_PATH" --require-certified; then
            echo "Promotion prevention check failed: synthetic fixture was accepted as certified"
            exit 1
          else
            echo "Promotion prevention verified: synthetic fixture was cleanly rejected as certified"
          fi

      - name: Verify paired comparison execution
        env:
          MANIFEST_A: ${{ runner.temp }}/vlm_ci_zero.json
          MANIFEST_B: ${{ runner.temp }}/vlm_ci_few.json
          MANIFEST_BOTH: ${{ runner.temp }}/vlm_ci_manifest.json
          COMPARE_AB_PATH: ${{ runner.temp }}/vlm_ci_comparison_ab.json
          COMPARE_BOTH_PATH: ${{ runner.temp }}/vlm_ci_comparison_both.json
        run: |
          python -m tools.vlm_baselines run \
            --model mock-vision-v1 \
            --shot-mode zero-shot \
            --output "$MANIFEST_A"
          python -m tools.vlm_baselines run \
            --model mock-vision-v1 \
            --shot-mode few-shot \
            --output "$MANIFEST_B"
          python -m tools.vlm_baselines paired-compare \
            --manifest-a "$MANIFEST_A" \
            --manifest-b "$MANIFEST_B" \
            --output "$COMPARE_AB_PATH"
          python -m tools.vlm_baselines paired-compare \
            --manifest-a "$MANIFEST_BOTH" \
            --manifest-b "$MANIFEST_BOTH" \
            --shot-mode-a zero-shot \
            --shot-mode-b few-shot \
            --output "$COMPARE_BOTH_PATH"

      - name: Verify fail-closed hardware barrier on real-smoke
        run: |
          if python -m tools.vlm_baselines real-smoke --model qwen2.5-vl-7b-instruct; then
            echo "Expected real-smoke to fail closed due to missing GPU/weights, but it succeeded!"
            exit 1
          else
            echo "Real-smoke correctly failed closed reporting hardware/weights barrier"
          fi

      - name: Verify real-smoke diagnostic with simulated double
        env:
          SMOKE_REPORT_PATH: ${{ runner.temp }}/vlm_smoke_report.json
        run: |
          python -m tools.vlm_baselines real-smoke \
            --model qwen2.5-vl-7b-instruct \
            --allow-simulated \
            --output "$SMOKE_REPORT_PATH"

      - name: Run VLM baseline unit and negative tests
        run: python -m unittest tests/evaluation/test_vlm_baselines.py -v

      - name: Run full evaluation test discovery
        run: python -m unittest discover -s tests/evaluation -v
