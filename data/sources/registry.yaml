    attribution_requirements: "Preserve each public item's source attribution; commissioned items retain Aly Moursy's copyright and evaluation-only permission"
    training_use: prohibited
    development_use: prohibited
    evaluation_use: allowed
    redistribution_use: conditional
    commercial_use: not_approved
    model_release_review: required
    automated_access_constraints: [preserve_benchmark_quarantine, preserve_sealed_item_answers, retain_per_item_source_rights]
