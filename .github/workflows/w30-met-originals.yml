name: W30 A authentic original-photo cross-manuscript generalization
on:
  push:
    branches: ['overseer/w30-met-cc0-edge-generalization']
    paths: ['tools/w30_met_originals.py','tests/research/test_w30_met_originals.py','.github/workflows/w30-met-originals.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-met-museum-research:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 Pillow==11.3.0
      - name: Verify prospective source lock and model tests
        run: |
          test -s docs/waves/W30_A_PREREG_MET_ORIGINALS.md
          python -m unittest tests.research.test_w30_met_originals -v
      - name: Original two-train two-new-test Met photographic model replay
        run: |
          python -m tools.w30_met_originals --output "$RUNNER_TEMP/w30-met.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'w30-met.json').read_text())
          assert len(r['untouched_new_source_test_results'])==2
          assert r['train_physical_support_count']==2 and r['test_physical_support_count']==2
          assert r['actual_hieratic_transcription_accuracy'] is None
          print('PASS genuine physical-source heldout original pixel restoration')
          PY
      - if: success()
        uses: actions/upload-artifact@v4
        with:
          name: w30-original-cc0-photo-metrics
          path: ${{ runner.temp }}/w30-met.json
          retention-days: 14
