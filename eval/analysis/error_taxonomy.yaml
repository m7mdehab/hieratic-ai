taxonomy_version: "1.0.0"
updated_at: "2026-10-08"
metric_contract: "eval/metric_contract.yaml"
metadata:
  purpose: "Consistent, evidence-linked failure attribution; no automatic replacement for layer-specific metrics."
  primary_code_rule: "Earliest demonstrably supported failure in the reading chain; do not infer hidden upstream errors from downstream symptoms."
  severity:
    critical: "Invalidates a stated research claim or fabricates core source content."
    major: "Materially alters source reading or interpretation."
    minor: "Localized, non-material error under the frozen evaluation rubric."
  attribution_status:
    observed: "Output behavior observed; causal failure not yet independently adjudicated."
    adjudicated: "Evidence reviewed and primary failure assigned."
    disputed: "Multiple reviewers disagree; not part of final confirmed-rate claims."
  gold_status:
    - certain
    - uncertain_with_alternatives
    - illegible_unscorable
    - missing_annotation
    - adjudication_pending
