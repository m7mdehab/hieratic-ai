name: Project Governance

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'task/**'

permissions:
  contents: read

jobs:
  governance:
    name: Validate project state and governance tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install governance dependencies
        run: python -m pip install -r requirements-projectctl.txt

      - name: Validate canonical project state
        run: python -m tools.projectctl validate

      - name: Run governance tests
        run: python -m unittest discover -s tests/governance -v

      - name: Validate source registry
        run: python -m tools.source_registry validate

      - name: Run all data tests
        run: python -m unittest discover -s tests/data -v

      - name: Run all linguistic normalization tests
        run: |
          if test -d tests/linguistics; then
            python -m unittest discover -s tests/linguistics -v
          else
            echo "Linguistics suite is not yet on main; it activates when LING-001 is merged."
          fi

      - name: Run all evaluation tests
        run: python -m unittest discover -s tests/evaluation -v

      - name: Enforce actual changed-file write scope on task branches
        if: (github.event_name == 'pull_request' && startsWith(github.head_ref, 'task/')) || (github.event_name == 'push' && startsWith(github.ref_name, 'task/'))
        env:
          TASK_BRANCH: ${{ github.head_ref || github.ref_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          from tools.governance_contract import SCOPES, check_scope, read_payload

          branch = os.environ["TASK_BRANCH"]
          match = re.match(r"^task/([A-Z]+-[0-9]{3})-[a-z0-9-]+$", branch)
          if not match:
              raise SystemExit(f"FAIL: malformed task branch: {branch}")
          # PR checkout is refs/pull/N/merge: first parent is the
          # current base. A task-branch push is a regular commit: compare
          # against the main merge-base instead, not only HEAD^.
          if os.environ["GITHUB_EVENT_NAME"] == "pull_request":
              parents = subprocess.check_output(
                  ["git", "rev-list", "--parents", "-n", "1", "HEAD"], text=True
              ).split()
              if len(parents) != 3:
                  raise SystemExit("FAIL: PR checkout is not a two-parent merge commit")
              current_base = parents[1]
          else:
              current_base = subprocess.check_output(
                  ["git", "merge-base", "origin/main", "HEAD"], text=True
              ).strip()
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", current_base, "HEAD"],
              text=True,
          ).splitlines()
          errors = check_scope(match.group(1), changed, read_payload(SCOPES))
          if errors:
              for error in errors:
                  print("FAIL:", error)
              raise SystemExit(1)
          print(f"PASS: {match.group(1)} write scope matches {len(changed)} actual changed files")
          PY
