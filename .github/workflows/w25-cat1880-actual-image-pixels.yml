name: W25 Authentic Cat1880 CC0 Photographic Pixel Falsification
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/w25-cat1880-actual-image-pixels.yml"
      - "tools/research_cat1880_pixels.py"
      - "tests/research/test_cat1880_pixels.py"
      - "docs/research/R031_CAT1880_PIXEL_DIAGNOSTIC.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  genuine-original-pixel-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - name: Install pinned minimal image dependencies
        run: python -m pip install --disable-pip-version-check "numpy==2.2.6" "Pillow==12.0.0"
      - name: Run mandatory fake-image and transformation controls
        run: python -m unittest tests.research.test_cat1880_pixels -v
      - name: Execute one original museum full-photo against image perturbations
        run: python -m tools.research_cat1880_pixels --output "$RUNNER_TEMP/w25-cc0-real-original-photo-nonmodel.json"
      - name: Preserve only source hash and aggregate diagnostic metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w25-authentic-photo-pixel-aggregate-no-images
          path: /home/runner/work/_temp/w25-cc0-real-original-photo-nonmodel.json
          if-no-files-found: warn
          retention-days: 30
