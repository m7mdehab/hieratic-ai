name: W16 Original TLA Late Egyptian Transfer Evidence
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/w16-tla-original-source.yml"
      - "ling/translation/w15_tla_transfer.py"
      - "ling/translation/experiments/W16_TLA_REAL_SOURCE_EVALUATION.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-tla-source:
    name: Score pinned original public Late Egyptian translations
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Download, verify original Git blob, and score the W15 preregistered method
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tla-w16"
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys, urllib.request
          from ling.translation.w15_tla_transfer import (
              TLA_DATASET, TLA_REVISION, TLA_PUBLISHER_GIT_BLOB,
              TLA_TARGET_SENTENCES, MAX_TARGET_BYTES, git_blob_sha
          )
          assert TLA_TARGET_SENTENCES == 3606
          url = "https://huggingface.co/datasets/" + TLA_DATASET + "/resolve/" + TLA_REVISION + "/train.jsonl"
          req = urllib.request.Request(url,headers={"User-Agent":"HieraticAI-W16-CCBYSA-original-research/1.0"})
          with urllib.request.urlopen(req,timeout=50) as response:
              assert response.status == 200, "Publisher source unavailable"
              body = response.read(MAX_TARGET_BYTES+1)
          if not 1 <= len(body) <= MAX_TARGET_BYTES:
              raise SystemExit("FAIL: source byte-size bound")
          blob = git_blob_sha(body)
          digest = hashlib.sha256(body).hexdigest()
          print(json.dumps({"publisher_revision":TLA_REVISION,"original_git_blob":blob,
                "expected_blob":TLA_PUBLISHER_GIT_BLOB,"original_sha256":digest,
                "bytes":len(body)},sort_keys=True),flush=True)
          if blob != TLA_PUBLISHER_GIT_BLOB:
              raise SystemExit("FAIL: pinned publisher Git blob differs: original cohort not scored")
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "tla-w16"
          source = root / "train.jsonl"
          source.write_bytes(body)
          verify = subprocess.run([sys.executable,"-m","ling.translation.w15_tla_transfer",
                 "verify-target","--target-path",str(source)],capture_output=True,text=True,check=True)
          meta = json.loads(verify.stdout)
          assert meta["rows"] == 3606
          results = subprocess.run([sys.executable,"-m","ling.translation.w15_tla_transfer",
                 "evaluate","--target-path",str(source)],capture_output=True,text=True,check=True)
          report = json.loads(results.stdout)
          assert report["evaluation_sentences"] == 3606
          assert report["scientific_CAPABILITY_credit"] == 0.0
          assert report["publisher_original_witness_ids_available"] is False
          assert report["certified_fluent_semantic_translation"] is False
          assert report["original_hieratic_image_input"] is False
          assert report["official_EgyptianPC_TEST_opened"] is False
          root.joinpath("w16-aggregate-only-report.json").write_text(
              json.dumps(report,indent=2,sort_keys=True,ensure_ascii=False)+"\n",encoding="utf-8")
          root.joinpath("w16-source-digests.json").write_text(
              json.dumps({"original_sha256":digest,"publisher_git_blob":blob,
                "original_bytes":len(body),"publisher_revision":TLA_REVISION,
                "rows":3606,"source_rights":"CC-BY-SA-4.0",
                "original_source_bytes_uploaded":False},indent=2)+"\n",encoding="utf-8")
          print(json.dumps({"status":"ORIGINAL_SOURCE_SCORE_COMPLETED","source_sha256":digest,
              "sentences":3606,"form_coverage":report["token_form_coverage"],
              "word_F1":report["german_word_micro_F1"],"report_sha256":report["report_sha256"],
              "independent_witness":False,"image_recognition":False,"capability_points":0.0
              },sort_keys=True),flush=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("## Original TLA Late Egyptian W16\n\n")
              f.write("Git blob: "+blob+"; source SHA-256: "+digest+"; 3,606 sentences\n\n")
              f.write("German word F1: "+str(report["german_word_micro_F1"])+
                      "; Egyptian coverage: "+str(report["token_form_coverage"])+
                      "; **No independent witness gold, no Hieratic OCR and no capability points.**\n")
          source.unlink()
          PY
      - name: Store aggregate-only evidence; no TLA source rows
        uses: actions/upload-artifact@v4
        with:
          name: w16-tla-aggregate-evidence
          path: |
            /home/runner/work/_temp/tla-w16/w16-aggregate-only-report.json
            /home/runner/work/_temp/tla-w16/w16-source-digests.json
          if-no-files-found: error
          retention-days: 30
